<svg viewBox="0 0 900 330" width="900" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New',Consolas,ui-monospace,monospace">
  <defs>
    <linearGradient id="m2panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d111a"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <linearGradient id="m2name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#ff5cf2"/>
    </linearGradient>
    <radialGradient id="m2glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m2glowM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5cf2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff5cf2" stop-opacity="0"/>
    </radialGradient>
    <filter id="m2soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="m2blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <pattern id="m2scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <clipPath id="m2clip"><rect x="14" y="14" width="872" height="302" rx="12"/></clipPath>
  </defs>

  <style>
    @keyframes m2pulse{0%,100%{opacity:1}50%{opacity:0.35}}
    @keyframes m2beam{0%{transform:translateX(-260px)}100%{transform:translateX(900px)}}
    @keyframes m2caret{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes m2flick{0%,96%,100%{opacity:0}97%{opacity:0.5}98%{opacity:0}}
    .m2led{animation:m2pulse 2.4s ease-in-out infinite;transform-origin:center}
    .m2beam{animation:m2beam 6s linear infinite}
    .m2caret{animation:m2caret 1s step-end infinite}
    .m2glitch{animation:m2flick 5s linear infinite}
    @media (prefers-reduced-motion:reduce){.m2led,.m2beam,.m2caret,.m2glitch{animation:none}}
  </style>

  <!-- panel -->
  <rect x="14" y="14" width="872" height="302" rx="12" fill="url(#m2panel)" stroke="#222b3d" stroke-width="1.2"/>
  <rect x="15.5" y="15.5" width="869" height="299" rx="11" fill="none" stroke="#22d3ee" stroke-opacity="0.16"/>

  <g clip-path="url(#m2clip)">
    <!-- depth glows -->
    <ellipse cx="120" cy="60" rx="150" ry="120" fill="url(#m2glowC)" filter="url(#m2blur)" opacity="0.5"/>
    <ellipse cx="820" cy="300" rx="170" ry="130" fill="url(#m2glowM)" filter="url(#m2blur)" opacity="0.45"/>
    <rect x="14" y="14" width="872" height="302" fill="url(#m2scan)"/>
    <!-- scan beam -->
    <rect class="m2beam" x="14" y="14" width="120" height="302" fill="#22d3ee" opacity="0.04"/>
    <!-- edge telemetry ticks -->
    <g fill="#566072" opacity="0.10" font-size="7" letter-spacing="1">
      <text x="864" y="120">0x1A</text>
      <text x="864" y="150">0x2F</text>
      <text x="864" y="180">0x37</text>
      <text x="864" y="210">0x05</text>
      <text x="864" y="240">0x03</text>
    </g>
  </g>

  <!-- corner reticles -->
  <g stroke="#22d3ee" stroke-width="1.4" fill="none" stroke-opacity="0.7">
    <path d="M26 40 L26 26 L40 26"/>
    <path d="M860 26 L874 26 L874 40"/>
    <path d="M26 290 L26 304 L40 304"/>
    <path d="M860 304 L874 304 L874 290"/>
  </g>

  <!-- header -->
  <g>
    <circle class="m2led" cx="40" cy="44" r="4" fill="#27c93f"/>
    <circle cx="40" cy="44" r="4" fill="none" stroke="#27c93f" stroke-opacity="0.4"/>
    <text x="54" y="48" fill="#22d3ee" font-size="12.5" font-weight="bold" letter-spacing="2" filter="url(#m2soft)">MOD-02 // FEATURED</text>
    <!-- signal bars -->
    <g fill="#22d3ee" opacity="0.8">
      <rect x="772" y="46" width="3" height="4"/>
      <rect x="777" y="43" width="3" height="7"/>
      <rect x="782" y="40" width="3" height="10"/>
      <rect x="787" y="37" width="3" height="13"/>
    </g>
    <text x="862" y="48" fill="#7d8590" font-size="11" letter-spacing="1" text-anchor="end">~/featured</text>
  </g>
  <line x1="26" y1="60" x2="874" y2="60" stroke="#283246" stroke-width="1"/>

  <!-- prompt -->
  <g font-size="12.5">
    <text x="30" y="84">
      <tspan fill="#27c93f">ekaznyra@sec</tspan><tspan fill="#9aa6b8">:</tspan><tspan fill="#22d3ee">~$</tspan><tspan fill="#e6edf3"> ls -la ~/featured </tspan><tspan fill="#ff5cf2">--sort=stars</tspan>
    </text>
    <rect class="m2caret" x="380" y="74" width="7" height="13" fill="#22d3ee"/>
  </g>
  <g class="m2glitch"><text x="30" y="84" font-size="12.5" fill="#ff5cf2">ekaznyra@sec:~$ ls -la ~/featured --sort=stars</text></g>

  <!-- table rows -->
  <g font-size="13">
    <!-- row template: name | star | chip | desc -->
    <!-- row 1 -->
    <rect x="26" y="98" width="848" height="34" rx="4" fill="#22d3ee" opacity="0.035"/>
    <text x="42" y="120" fill="#22d3ee" font-weight="bold" filter="url(#m2soft)">NguyenNgocAnhTu</text>
    <text x="248" y="120" fill="#ffbd2e">★</text>
    <text x="262" y="120" fill="#e6edf3">37</text>
    <rect x="300" y="108" width="92" height="17" rx="8.5" fill="#f7df1e" opacity="0.14" stroke="#f7df1e" stroke-opacity="0.35"/>
    <circle cx="312" cy="116.5" r="3" fill="#f7df1e"/>
    <text x="320" y="121" fill="#e6edf3" font-size="10.5">JavaScript</text>
    <text x="408" y="120" fill="#9aa6b8" font-size="12">Premium personal profile site</text>

    <!-- row 2 -->
    <text x="42" y="156" fill="#22d3ee" font-weight="bold" filter="url(#m2soft)">GDrive_Turbo_Copy</text>
    <text x="248" y="156" fill="#ffbd2e">★</text>
    <text x="262" y="156" fill="#e6edf3">15</text>
    <rect x="300" y="144" width="78" height="17" rx="8.5" fill="#da5b0b" opacity="0.14" stroke="#da5b0b" stroke-opacity="0.4"/>
    <circle cx="312" cy="152.5" r="3" fill="#da5b0b"/>
    <text x="320" y="157" fill="#e6edf3" font-size="10.5">Jupyter</text>
    <text x="408" y="156" fill="#9aa6b8" font-size="12">Multithreaded Google Drive copier · auto-resume · Colab</text>

    <!-- row 3 -->
    <rect x="26" y="170" width="848" height="34" rx="4" fill="#22d3ee" opacity="0.035"/>
    <text x="42" y="192" fill="#22d3ee" font-weight="bold" filter="url(#m2soft)">bypass-rophim</text>
    <text x="248" y="192" fill="#ffbd2e">★</text>
    <text x="262" y="192" fill="#e6edf3">10</text>
    <rect x="300" y="180" width="92" height="17" rx="8.5" fill="#f7df1e" opacity="0.14" stroke="#f7df1e" stroke-opacity="0.35"/>
    <circle cx="312" cy="188.5" r="3" fill="#f7df1e"/>
    <text x="320" y="193" fill="#e6edf3" font-size="10.5">JavaScript</text>
    <text x="408" y="192" fill="#9aa6b8" font-size="12">Handy browser userscript</text>

    <!-- row 4 -->
    <text x="42" y="228" fill="#22d3ee" font-weight="bold" filter="url(#m2soft)">Clear_data_windows</text>
    <text x="248" y="228" fill="#ffbd2e">★</text>
    <text x="262" y="228" fill="#e6edf3">5</text>
    <rect x="300" y="216" width="92" height="17" rx="8.5" fill="#012456" opacity="0.5" stroke="#5391fe" stroke-opacity="0.5"/>
    <circle cx="312" cy="224.5" r="3" fill="#5391fe"/>
    <text x="320" y="229" fill="#e6edf3" font-size="10.5">PowerShell</text>
    <text x="408" y="228" fill="#9aa6b8" font-size="12">Windows cleanup toolkit</text>

    <!-- row 5 -->
    <rect x="26" y="242" width="848" height="34" rx="4" fill="#22d3ee" opacity="0.035"/>
    <text x="42" y="264" fill="#22d3ee" font-weight="bold" filter="url(#m2soft)">VMware-WS-Pro-archive</text>
    <text x="248" y="264" fill="#ffbd2e">★</text>
    <text x="262" y="264" fill="#e6edf3">3</text>
    <rect x="300" y="252" width="92" height="17" rx="8.5" fill="#012456" opacity="0.5" stroke="#5391fe" stroke-opacity="0.5"/>
    <circle cx="312" cy="260.5" r="3" fill="#5391fe"/>
    <text x="320" y="265" fill="#e6edf3" font-size="10.5">PowerShell</text>
    <text x="408" y="264" fill="#9aa6b8" font-size="12">VMware installer mirror archive</text>
  </g>

  <!-- footer -->
  <line x1="26" y1="288" x2="874" y2="288" stroke="#1b2230" stroke-width="1"/>
  <text x="42" y="306" fill="#566072" font-size="11" letter-spacing="0.5"># 7 public repos · ★72 total</text>
  <text x="862" y="306" fill="#566072" font-size="10" text-anchor="end" opacity="0.7">01000110 01000101 01000100</text>
</svg>