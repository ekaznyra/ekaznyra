<svg viewBox="0 0 900 320" width="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="winbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d111a"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="winclip">
      <rect x="18" y="14" width="864" height="292" rx="12"/>
    </clipPath>
  </defs>

  <!-- full-bleed bg -->
  <rect x="0" y="0" width="900" height="320" fill="#0d1117"/>

  <!-- window -->
  <rect x="18" y="14" width="864" height="292" rx="12" fill="url(#winbg)" stroke="#222b3d" stroke-width="1.2"/>

  <!-- ambient glows + scanlines clipped to window -->
  <g clip-path="url(#winclip)">
    <circle cx="80" cy="60" r="120" fill="#22d3ee" opacity="0.05" filter="url(#blur)"/>
    <circle cx="850" cy="300" r="130" fill="#ff5cf2" opacity="0.05" filter="url(#blur)"/>
    <rect x="18" y="14" width="864" height="292" fill="url(#scan)"/>
  </g>

  <!-- neon edge -->
  <rect x="18" y="14" width="864" height="292" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.16"/>

  <!-- title bar -->
  <g font-family="'Courier New',Consolas,ui-monospace,monospace">
    <circle cx="44" cy="34" r="6" fill="#ff5f56"/>
    <circle cx="64" cy="34" r="6" fill="#ffbd2e"/>
    <circle cx="84" cy="34" r="6" fill="#27c93f"/>
    <text x="450" y="38" text-anchor="middle" font-size="12.5" fill="#9aa6b8">projects — ekaznyra@sec</text>
    <text x="866" y="38" text-anchor="end" font-size="12" fill="#22d3ee" opacity="0.75">~/featured</text>
    <line x1="18" y1="50" x2="882" y2="50" stroke="#283246" stroke-width="1"/>
  </g>

  <!-- prompt line -->
  <g font-family="'Courier New',Consolas,ui-monospace,monospace" font-size="13">
    <text x="40" y="76">
      <tspan fill="#27c93f">ekaznyra@sec</tspan><tspan fill="#7d8590">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#7d8590">$ </tspan><tspan fill="#e6edf3">ls -la ~/featured </tspan><tspan fill="#ff5cf2">--sort=stars</tspan>
    </text>
  </g>

  <!-- repo rows -->
  <!-- columns: glyph x=44 | name x=66 | star x=300 | lang chip x=400 | desc x=510 -->
  <g font-family="'Courier New',Consolas,ui-monospace,monospace" font-size="13">

    <!-- row 1 -->
    <g>
      <rect x="36" y="92" width="828" height="32" rx="6" fill="#ffffff" opacity="0.022"/>
      <text x="48" y="113" fill="#7d8590">▸</text>
      <text x="68" y="113" fill="#22d3ee" font-weight="bold">NguyenNgocAnhTu</text>
      <text x="300" y="113"><tspan fill="#ffbd2e">★</tspan><tspan fill="#e6edf3"> 37</tspan></text>
      <rect x="396" y="100" width="92" height="18" rx="9" fill="#f1e05a" opacity="0.10" stroke="#f1e05a" stroke-opacity="0.45" stroke-width="1"/>
      <text x="442" y="113" text-anchor="middle" font-size="11" fill="#f1e05a">JavaScript</text>
      <text x="508" y="113" fill="#9aa6b8">Premium personal profile site</text>
    </g>

    <!-- row 2 -->
    <g>
      <text x="48" y="151" fill="#7d8590">▸</text>
      <text x="68" y="151" fill="#22d3ee" font-weight="bold">GDrive_Turbo_Copy</text>
      <text x="300" y="151"><tspan fill="#ffbd2e">★</tspan><tspan fill="#e6edf3"> 15</tspan></text>
      <rect x="396" y="138" width="92" height="18" rx="9" fill="#da5b0b" opacity="0.10" stroke="#da5b0b" stroke-opacity="0.45" stroke-width="1"/>
      <text x="442" y="151" text-anchor="middle" font-size="11" fill="#f08d3c">Jupyter</text>
      <text x="508" y="151" fill="#9aa6b8">Multithreaded Drive copier · auto-resume · Colab</text>
    </g>

    <!-- row 3 -->
    <g>
      <rect x="36" y="168" width="828" height="32" rx="6" fill="#ffffff" opacity="0.022"/>
      <text x="48" y="189" fill="#7d8590">▸</text>
      <text x="68" y="189" fill="#22d3ee" font-weight="bold">bypass-rophim</text>
      <text x="300" y="189"><tspan fill="#ffbd2e">★</tspan><tspan fill="#e6edf3"> 10</tspan></text>
      <rect x="396" y="176" width="92" height="18" rx="9" fill="#f1e05a" opacity="0.10" stroke="#f1e05a" stroke-opacity="0.45" stroke-width="1"/>
      <text x="442" y="189" text-anchor="middle" font-size="11" fill="#f1e05a">JavaScript</text>
      <text x="508" y="189" fill="#9aa6b8">Handy browser userscript</text>
    </g>

    <!-- row 4 -->
    <g>
      <text x="48" y="227" fill="#7d8590">▸</text>
      <text x="68" y="227" fill="#22d3ee" font-weight="bold">Clear_data_windows</text>
      <text x="300" y="227"><tspan fill="#ffbd2e">★</tspan><tspan fill="#e6edf3"> 5</tspan></text>
      <rect x="396" y="214" width="92" height="18" rx="9" fill="#012456" opacity="0.30" stroke="#5391fe" stroke-opacity="0.50" stroke-width="1"/>
      <text x="442" y="227" text-anchor="middle" font-size="11" fill="#7fb0ff">PowerShell</text>
      <text x="508" y="227" fill="#9aa6b8">Windows cleanup toolkit</text>
    </g>

    <!-- row 5 -->
    <g>
      <rect x="36" y="244" width="828" height="32" rx="6" fill="#ffffff" opacity="0.022"/>
      <text x="48" y="265" fill="#7d8590">▸</text>
      <text x="68" y="265" fill="#22d3ee" font-weight="bold">VMware-WS-Pro-archive</text>
      <text x="300" y="265"><tspan fill="#ffbd2e">★</tspan><tspan fill="#e6edf3"> 3</tspan></text>
      <rect x="396" y="252" width="92" height="18" rx="9" fill="#012456" opacity="0.30" stroke="#5391fe" stroke-opacity="0.50" stroke-width="1"/>
      <text x="442" y="265" text-anchor="middle" font-size="11" fill="#7fb0ff">PowerShell</text>
      <text x="508" y="265" fill="#9aa6b8">VMware installer mirror archive</text>
    </g>

  </g>

  <!-- footer comment + cursor -->
  <g font-family="'Courier New',Consolas,ui-monospace,monospace" font-size="12">
    <text x="40" y="296" fill="#566072"># 7 public repos · ★72 total</text>
    <rect x="262" y="287" width="8" height="13" fill="#22d3ee">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>