<svg viewBox="0 0 900 250" width="900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MOD-05 GIT LOG — stars 75, repos 6, followers 22, following 0; top languages JavaScript 50%, Python 26%, PowerShell 19%, Other 5%" font-family="'Courier New',Consolas,ui-monospace,monospace">
  <title>MOD-05 // GIT LOG — profile stats &amp; top languages</title>
  <defs>
    <linearGradient id="m5panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d111a"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <linearGradient id="m5name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#ff5cf2"/>
    </linearGradient>
    <radialGradient id="m5glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m5glowM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5cf2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff5cf2" stop-opacity="0"/>
    </radialGradient>
    <filter id="m5soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="m5blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="m5scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <clipPath id="m5clip"><rect x="14" y="14" width="872" height="222" rx="12"/></clipPath>
    <clipPath id="m5bar"><rect x="470" y="122" width="388" height="12" rx="6"/></clipPath>
    <style>
      @keyframes m5pulse{0%,100%{opacity:1}50%{opacity:.35}}
      @keyframes m5beam{0%{transform:translateX(-200px)}100%{transform:translateX(900px)}}
      @keyframes m5caret{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes m5grow{0%{transform:scaleX(0);opacity:.2}100%{transform:scaleX(1);opacity:1}}
      .m5led{animation:m5pulse 2.2s ease-in-out infinite;transform-origin:center}
      .m5beam{animation:m5beam 7s linear infinite}
      .m5caret{animation:m5caret 1.05s steps(1) infinite}
      .m5segwrap{animation:m5grow 1.4s cubic-bezier(.2,.7,.2,1) both;transform-origin:470px 128px}
      @media (prefers-reduced-motion:reduce){.m5led,.m5beam,.m5caret,.m5segwrap{animation:none}}
    </style>
  </defs>

  <!-- panel -->
  <rect x="14" y="14" width="872" height="222" rx="12" fill="url(#m5panel)" stroke="#222b3d" stroke-width="1.2"/>
  <rect x="15.5" y="15.5" width="869" height="219" rx="11" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.16"/>

  <g clip-path="url(#m5clip)">
    <circle cx="120" cy="60" r="150" fill="url(#m5glowC)" filter="url(#m5blur)" opacity="0.5"/>
    <circle cx="800" cy="220" r="160" fill="url(#m5glowM)" filter="url(#m5blur)" opacity="0.45"/>
    <rect x="14" y="14" width="872" height="222" fill="url(#m5scan)"/>
    <g class="m5beam"><rect x="14" y="14" width="150" height="222" fill="url(#m5glowC)" opacity="0.05"/></g>
    <g fill="#22d3ee" opacity="0.08" font-size="7" letter-spacing="2">
      <text x="26" y="230">01000111 01001001 01010100 00100000 01001100 01001111 01000111 // COMMIT.HISTORY</text>
    </g>
  </g>

  <!-- corner reticles -->
  <g stroke="#22d3ee" stroke-width="1.4" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M26 40 L26 26 L40 26"/>
    <path d="M860 26 L874 26 L874 40"/>
    <path d="M26 210 L26 224 L40 224"/>
    <path d="M860 224 L874 224 L874 210"/>
  </g>

  <!-- header -->
  <g>
    <circle class="m5led" cx="42" cy="42" r="4.5" fill="#27c93f" filter="url(#m5soft)"/>
    <circle cx="42" cy="42" r="4.5" fill="none" stroke="#27c93f" stroke-width="1" opacity="0.4"/>
    <text x="58" y="46" fill="#22d3ee" font-size="12.5" letter-spacing="2.5" font-weight="bold" filter="url(#m5soft)">MOD-05 // GIT LOG</text>
    <g fill="#22d3ee" opacity="0.85">
      <rect x="792" y="44" width="3" height="4"/>
      <rect x="797" y="41" width="3" height="7"/>
      <rect x="802" y="38" width="3" height="10"/>
      <rect x="807" y="35" width="3" height="13"/>
    </g>
    <text x="862" y="46" fill="#7d8590" font-size="10.5" text-anchor="end" letter-spacing="1.5">~/stats</text>
  </g>
  <line x1="26" y1="56" x2="874" y2="56" stroke="#1b2230" stroke-width="1"/>

  <!-- prompt -->
  <g font-size="12.5">
    <text x="40" y="80"><tspan fill="#27c93f">ekaznyra@sec</tspan><tspan fill="#9aa6b8">:</tspan><tspan fill="#22d3ee">~$</tspan><tspan fill="#e6edf3"> git log --stat --graph</tspan></text>
    <rect class="m5caret" x="341" y="71" width="7" height="11" fill="#22d3ee"/>
  </g>

  <!-- column divider -->
  <line x1="450" y1="98" x2="450" y2="216" stroke="#1b2230" stroke-width="1"/>

  <!-- ===== LEFT: summary ===== -->
  <text x="40" y="110" fill="#566072" font-size="10" letter-spacing="1.5"># summary</text>
  <g font-size="12.5" letter-spacing="0.5">
    <!-- stars -->
    <text x="40" y="140" fill="#9aa6b8">stars</text>
    <line x1="112" y1="136" x2="392" y2="136" stroke="#283246" stroke-width="1" stroke-dasharray="1 4"/>
    <text x="418" y="140" fill="#ffbd2e" font-weight="bold" text-anchor="end">★ 75</text>
    <!-- repos -->
    <text x="40" y="166" fill="#9aa6b8">repos</text>
    <line x1="112" y1="162" x2="398" y2="162" stroke="#283246" stroke-width="1" stroke-dasharray="1 4"/>
    <text x="418" y="166" fill="#e6edf3" font-weight="bold" text-anchor="end">06</text>
    <!-- followers -->
    <text x="40" y="192" fill="#9aa6b8">followers</text>
    <line x1="150" y1="188" x2="398" y2="188" stroke="#283246" stroke-width="1" stroke-dasharray="1 4"/>
    <text x="418" y="192" fill="#e6edf3" font-weight="bold" text-anchor="end">22</text>
    <!-- following -->
    <text x="40" y="218" fill="#9aa6b8">following</text>
    <line x1="150" y1="214" x2="398" y2="214" stroke="#283246" stroke-width="1" stroke-dasharray="1 4"/>
    <text x="418" y="218" fill="#e6edf3" font-weight="bold" text-anchor="end">00</text>
  </g>

  <!-- ===== RIGHT: top languages ===== -->
  <text x="470" y="110" fill="#566072" font-size="10" letter-spacing="1.5"># top languages</text>

  <!-- stacked bar -->
  <g class="m5segwrap">
    <rect x="470" y="122" width="388" height="12" rx="6" fill="#0e1620" stroke="#283246" stroke-width="1"/>
    <g clip-path="url(#m5bar)">
      <rect x="470" y="122" width="194" height="12" fill="#f7df1e"/>
      <rect x="664" y="122" width="101" height="12" fill="#3572A5"/>
      <rect x="765" y="122" width="74"  height="12" fill="#5391fe"/>
      <rect x="839" y="122" width="19"  height="12" fill="#566072"/>
    </g>
  </g>

  <!-- legend -->
  <g font-size="11.5">
    <!-- JavaScript -->
    <circle cx="478" cy="154" r="4" fill="#f7df1e"/>
    <text x="492" y="158" fill="#e6edf3">JavaScript</text>
    <text x="858" y="158" fill="#9aa6b8" text-anchor="end">50.0%</text>
    <!-- Python -->
    <circle cx="478" cy="176" r="4" fill="#3572A5"/>
    <text x="492" y="180" fill="#e6edf3">Python</text>
    <text x="858" y="180" fill="#9aa6b8" text-anchor="end">26.0%</text>
    <!-- PowerShell -->
    <circle cx="478" cy="198" r="4" fill="#5391fe"/>
    <text x="492" y="202" fill="#e6edf3">PowerShell</text>
    <text x="858" y="202" fill="#9aa6b8" text-anchor="end">19.0%</text>
    <!-- Other -->
    <circle cx="478" cy="220" r="4" fill="#566072"/>
    <text x="492" y="224" fill="#e6edf3">Other</text>
    <text x="858" y="224" fill="#9aa6b8" text-anchor="end">5.0%</text>
  </g>
</svg>
