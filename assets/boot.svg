<svg viewBox="0 0 900 200" width="900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Secure boot sequence — decrypting operator profile ekaznyra, access granted" font-family="'Courier New',Consolas,ui-monospace,monospace">
  <title>MOD-00 // BOOT — secure boot &amp; profile decrypt</title>
  <desc>Animated cyberdeck boot log: kernel, detection engine, sensors and identity check pass, a decrypt progress bar fills to 100%, and an ACCESS GRANTED stamp appears.</desc>
  <defs>
    <linearGradient id="bt-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d111a"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <linearGradient id="bt-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#ff5cf2"/>
    </linearGradient>
    <linearGradient id="bt-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#7fe6f5"/>
      <stop offset="1" stop-color="#27c93f"/>
    </linearGradient>
    <linearGradient id="bt-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bt-glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bt-glowM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5cf2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff5cf2" stop-opacity="0"/>
    </radialGradient>
    <filter id="bt-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bt-bloom" x="-60%" y="-120%" width="220%" height="340%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="bt-scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <clipPath id="bt-clip"><rect x="8" y="8" width="884" height="184" rx="12"/></clipPath>
    <clipPath id="bt-barclip"><rect x="96" y="170" width="374" height="10" rx="5"/></clipPath>
    <style>
      @keyframes btled{0%,100%{opacity:1}50%{opacity:.35}}
      @keyframes btping{0%{transform:scale(1);opacity:.5}70%,100%{transform:scale(2.8);opacity:0}}
      @keyframes btcaret{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes btbreathe{0%,100%{opacity:.72}50%{opacity:.4}}
      @keyframes bteq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
      @keyframes btbeam{0%{transform:translateX(-200px)}100%{transform:translateX(900px)}}
      @keyframes btline{0%{opacity:0;transform:translateX(-8px)}100%{opacity:1;transform:translateX(0)}}
      @keyframes btok{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
      @keyframes btfill{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
      @keyframes btpct{0%{opacity:0}100%{opacity:1}}
      @keyframes btshim{0%{transform:translateX(-160px)}55%,100%{transform:translateX(520px)}}
      @keyframes btstamp{0%,72%{opacity:0;transform:rotate(-14deg) scale(1.6)}80%{opacity:1;transform:rotate(-14deg) scale(.92)}86%,100%{opacity:1;transform:rotate(-14deg) scale(1)}}
      .bt-led{animation:btled 1.9s ease-in-out infinite}
      .bt-ping{animation:btping 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
      .bt-caret{animation:btcaret 1.05s step-end infinite}
      .bt-breathe{animation:btbreathe 4s ease-in-out infinite}
      .bt-eqbar{animation:bteq 1.15s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
      .bt-beam{animation:btbeam 7s linear infinite}
      .bt-l1{animation:btline .5s ease-out both;animation-delay:.2s}
      .bt-l2{animation:btline .5s ease-out both;animation-delay:.9s}
      .bt-l3{animation:btline .5s ease-out both;animation-delay:1.6s}
      .bt-l4{animation:btline .5s ease-out both;animation-delay:2.3s}
      .bt-ok1{animation:btok .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:.55s;transform-box:fill-box;transform-origin:center}
      .bt-ok2{animation:btok .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:1.25s;transform-box:fill-box;transform-origin:center}
      .bt-ok3{animation:btok .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:1.95s;transform-box:fill-box;transform-origin:center}
      .bt-ok4{animation:btok .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:2.65s;transform-box:fill-box;transform-origin:center}
      .bt-fill{animation:btfill 2.6s cubic-bezier(.5,.05,.2,1) both;animation-delay:2.9s;transform-box:fill-box;transform-origin:left center}
      .bt-shim{animation:btshim 2.2s ease-in-out infinite;animation-delay:2.9s}
      .bt-pct{animation:btpct .5s ease-out both;animation-delay:5.3s}
      .bt-stamp{animation:btstamp 6.5s ease-out both;transform-box:fill-box;transform-origin:center}
      @media (prefers-reduced-motion:reduce){
        .bt-led,.bt-ping,.bt-caret,.bt-breathe,.bt-eqbar,.bt-beam,.bt-l1,.bt-l2,.bt-l3,.bt-l4,.bt-ok1,.bt-ok2,.bt-ok3,.bt-ok4,.bt-fill,.bt-shim,.bt-pct,.bt-stamp{animation:none}
      }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="200" fill="#0d1117"/>
  <rect x="8" y="8" width="884" height="184" rx="12" fill="url(#bt-panel)" stroke="#222b3d" stroke-width="1.2"/>
  <rect x="9.5" y="9.5" width="881" height="181" rx="11" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.16"/>

  <g clip-path="url(#bt-clip)">
    <circle cx="130" cy="70" r="200" fill="url(#bt-glowC)" opacity="0.55"/>
    <circle cx="800" cy="196" r="210" fill="url(#bt-glowM)" opacity="0.5"/>
    <rect x="8" y="8" width="884" height="184" fill="url(#bt-scan)"/>
    <g class="bt-beam"><rect x="8" y="8" width="150" height="184" fill="url(#bt-glowC)" opacity="0.05"/></g>
    <g fill="#22d3ee" opacity="0.07" font-size="7" letter-spacing="2">
      <text x="26" y="186">01000010 01001111 01001111 01010100 // POST // SECURE-SHELL // AES-256 // KEYRING::OK</text>
    </g>
  </g>

  <!-- corner reticles -->
  <g class="bt-breathe" stroke="#22d3ee" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M26 40 L26 26 L40 26"/>
    <path d="M860 26 L874 26 L874 40"/>
    <path d="M26 166 L26 180 L40 180"/>
    <path d="M860 180 L874 180 L874 166"/>
  </g>

  <!-- header -->
  <g>
    <circle class="bt-ping" cx="42" cy="42" r="4.5" fill="none" stroke="#27c93f" stroke-width="1.4"/>
    <circle class="bt-led" cx="42" cy="42" r="4.5" fill="#27c93f" filter="url(#bt-soft)"/>
    <circle cx="42" cy="42" r="4.5" fill="none" stroke="#27c93f" stroke-width="1" opacity="0.4"/>
    <text x="58" y="46" fill="#22d3ee" font-size="12.5" letter-spacing="2.5" font-weight="bold" filter="url(#bt-bloom)">MOD-00 // BOOT</text>
    <g fill="#22d3ee">
      <rect class="bt-eqbar" x="792" y="35" width="3" height="13"/>
      <rect class="bt-eqbar" x="797" y="35" width="3" height="13" style="animation-delay:-.35s"/>
      <rect class="bt-eqbar" x="802" y="35" width="3" height="13" style="animation-delay:-.7s"/>
      <rect class="bt-eqbar" x="807" y="35" width="3" height="13" style="animation-delay:-.9s"/>
    </g>
    <text x="862" y="46" fill="#7d8590" font-size="10.5" text-anchor="end" letter-spacing="1.5">~/boot · POST</text>
  </g>
  <line x1="26" y1="56" x2="874" y2="56" stroke="#1b2230" stroke-width="1"/>

  <!-- prompt -->
  <g font-size="12.5">
    <text x="40" y="80"><tspan fill="#27c93f">ekaznyra@sec</tspan><tspan fill="#9aa6b8">:</tspan><tspan fill="#22d3ee">~$</tspan><tspan fill="#e6edf3"> ./boot.sh </tspan><tspan fill="#ff5cf2">--decrypt-profile</tspan></text>
    <rect class="bt-caret" x="356" y="71" width="7" height="11" fill="#22d3ee"/>
  </g>

  <!-- boot log (left column) -->
  <g font-size="11.5" letter-spacing="0.3">
    <g class="bt-l1">
      <text x="40" y="100" fill="#566072">[</text>
      <text class="bt-ok1" x="52" y="100" fill="#27c93f" font-weight="bold">OK</text>
      <text x="70" y="100" fill="#566072">]</text>
      <text x="84" y="100" fill="#9aa6b8">kernel</text>
      <text x="150" y="100" fill="#283246" letter-spacing="1">····················</text>
      <text x="360" y="100" fill="#e6edf3">secure-shell up</text>
    </g>
    <g class="bt-l2">
      <text x="40" y="119" fill="#566072">[</text>
      <text class="bt-ok2" x="52" y="119" fill="#27c93f" font-weight="bold">OK</text>
      <text x="70" y="119" fill="#566072">]</text>
      <text x="84" y="119" fill="#9aa6b8">module</text>
      <text x="150" y="119" fill="#283246" letter-spacing="1">····················</text>
      <text x="360" y="119" fill="#e6edf3">detection-engine</text>
    </g>
    <g class="bt-l3">
      <text x="40" y="138" fill="#566072">[</text>
      <text class="bt-ok3" x="52" y="138" fill="#27c93f" font-weight="bold">OK</text>
      <text x="70" y="138" fill="#566072">]</text>
      <text x="84" y="138" fill="#9aa6b8">sensors</text>
      <text x="158" y="138" fill="#283246" letter-spacing="1">··················</text>
      <text x="360" y="138" fill="#ff5cf2">MITRE ATT&amp;CK armed</text>
    </g>
    <g class="bt-l4">
      <text x="40" y="157" fill="#566072">[</text>
      <text class="bt-ok4" x="52" y="157" fill="#27c93f" font-weight="bold">OK</text>
      <text x="70" y="157" fill="#566072">]</text>
      <text x="84" y="157" fill="#9aa6b8">identity</text>
      <text x="166" y="157" fill="#283246" letter-spacing="1">················</text>
      <text x="360" y="157" fill="#22d3ee">ekaznyra verified</text>
    </g>
  </g>

  <!-- decrypt progress bar (footer row) -->
  <text x="40" y="179" fill="#566072" font-size="10.5" letter-spacing="1">decrypt</text>
  <rect x="96" y="170" width="374" height="10" rx="5" fill="#0e1620" stroke="#283246" stroke-width="1"/>
  <g clip-path="url(#bt-barclip)">
    <rect class="bt-fill" x="96" y="170" width="374" height="10" fill="url(#bt-bar)"/>
    <g class="bt-shim"><rect x="96" y="170" width="90" height="10" fill="url(#bt-sheen)"/></g>
  </g>
  <text class="bt-pct" x="482" y="179" fill="#27c93f" font-size="11" font-weight="bold">100%</text>

  <!-- ACCESS GRANTED stamp (right) -->
  <g class="bt-stamp" transform="translate(690,116)">
    <g transform="rotate(-14)">
      <rect x="-96" y="-30" width="192" height="60" rx="8" fill="none" stroke="#27c93f" stroke-width="2.4" opacity="0.9"/>
      <rect x="-88" y="-22" width="176" height="44" rx="5" fill="none" stroke="#27c93f" stroke-width="1" opacity="0.4"/>
      <text x="0" y="-4" text-anchor="middle" fill="#27c93f" font-size="17" font-weight="bold" letter-spacing="3" filter="url(#bt-soft)">ACCESS</text>
      <text x="0" y="17" text-anchor="middle" fill="#27c93f" font-size="17" font-weight="bold" letter-spacing="3" filter="url(#bt-soft)">GRANTED</text>
    </g>
  </g>
</svg>
