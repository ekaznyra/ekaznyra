<svg viewBox="0 0 900 300" width="900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NGUYỄN NGỌC ANH TÚ — Cybersecurity Researcher" font-family="'Courier New',Consolas,ui-monospace,monospace">
<title>NGUYỄN NGỌC ANH TÚ — Cybersecurity Researcher hero header</title>
<desc>Holographic glitch cyber console header with RGB-split name, binary rain side margins, scan beam, alias ekaznyra, role and status readouts.</desc>
<defs>
<linearGradient id="hg-panel" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0d111a"/><stop offset="1" stop-color="#090c12"/>
</linearGradient>
<linearGradient id="hg-name" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#7fe6f5"/><stop offset="1" stop-color="#ff5cf2"/>
</linearGradient>
<linearGradient id="hg-shim" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hg-beam" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.5"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
</linearGradient>
<radialGradient id="hg-glowC" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
</radialGradient>
<radialGradient id="hg-glowM" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#ff5cf2" stop-opacity="0.45"/><stop offset="1" stop-color="#ff5cf2" stop-opacity="0"/>
</radialGradient>
<radialGradient id="hg-vig" cx="0.5" cy="0.5" r="0.75">
<stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
</radialGradient>
<filter id="hg-bloom" x="-40%" y="-60%" width="180%" height="220%">
<feGaussianBlur stdDeviation="4" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="hg-soft" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="2.2"/>
</filter>
<filter id="hg-blob" x="-80%" y="-80%" width="260%" height="260%">
<feGaussianBlur stdDeviation="34"/>
</filter>
<pattern id="hg-scan" width="3" height="3" patternUnits="userSpaceOnUse">
<rect width="3" height="1" fill="#ffffff" opacity="0.022"/>
</pattern>
<pattern id="hg-grid" width="30" height="30" patternUnits="userSpaceOnUse">
<path d="M30 0H0V30" fill="none" stroke="#22d3ee" stroke-width="0.5" opacity="0.05"/>
</pattern>
<clipPath id="hg-clip"><rect x="8" y="8" width="884" height="284" rx="12"/></clipPath>
</defs>

<rect x="0" y="0" width="900" height="300" fill="#0d1117"/>

<g clip-path="url(#hg-clip)">
<rect x="8" y="8" width="884" height="284" rx="12" fill="url(#hg-panel)"/>
<rect x="8" y="8" width="884" height="284" fill="url(#hg-grid)"/>
<ellipse cx="250" cy="150" rx="200" ry="150" fill="url(#hg-glowC)" filter="url(#hg-blob)"/>
<ellipse cx="690" cy="170" rx="190" ry="150" fill="url(#hg-glowM)" filter="url(#hg-blob)"/>

<g font-size="11" fill="#22d3ee" opacity="0.16" letter-spacing="1">
<text x="20" y="60">01001110</text>
<text x="20" y="78">01100111</text>
<text x="20" y="96">01110101</text>
<text x="20" y="114">01111001</text>
<text x="20" y="132">11100110</text>
<text x="20" y="150">00101110</text>
<text x="20" y="168">01101011</text>
<text x="20" y="186">01100001</text>
<text x="20" y="204">01111010</text>
<text x="20" y="222">01101110</text>
<text x="20" y="240">01111001</text>
<animateTransform attributeName="transform" type="translate" from="0 -20" to="0 0" dur="6s" repeatCount="indefinite"/>
</g>
<g font-size="11" fill="#ff5cf2" opacity="0.13" letter-spacing="1" text-anchor="end">
<text x="880" y="56">10110101</text>
<text x="880" y="74">01010011</text>
<text x="880" y="92">01001111</text>
<text x="880" y="110">01000011</text>
<text x="880" y="128">11010010</text>
<text x="880" y="146">01000100</text>
<text x="880" y="164">01000110</text>
<text x="880" y="182">01001001</text>
<text x="880" y="200">01010010</text>
<text x="880" y="218">01011001</text>
<text x="880" y="236">01000001</text>
<animateTransform attributeName="transform" type="translate" from="0 0" to="0 -20" dur="7s" repeatCount="indefinite"/>
</g>

<g opacity="0.6">
<rect x="430" y="8" width="3" height="284" fill="url(#hg-beam)" filter="url(#hg-soft)">
<animate attributeName="x" values="120;760;120" dur="9s" repeatCount="indefinite"/>
</rect>
</g>

<g>
<rect x="32" y="30" width="9" height="9" rx="2" fill="#22d3ee" opacity="0.9"/>
<rect x="46" y="30" width="9" height="9" rx="2" fill="#566072" opacity="0.7"/>
<rect x="60" y="30" width="9" height="9" rx="2" fill="#566072" opacity="0.7"/>
<text x="82" y="38" font-size="11" fill="#22d3ee" letter-spacing="3" filter="url(#hg-soft)">MOD-01 // IDENTITY</text>
<circle cx="200" cy="34.5" r="3.5" fill="#27c93f">
<animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
</circle>
<text x="210" y="38" font-size="10" fill="#27c93f" letter-spacing="1">ONLINE</text>
<text x="868" y="38" font-size="10" fill="#7d8590" text-anchor="end" letter-spacing="1">~/soc/profile.hero · ● REC</text>
<line x1="32" y1="50" x2="868" y2="50" stroke="#283246" stroke-width="1"/>
</g>

<g filter="url(#hg-bloom)">
<text x="450" y="150" text-anchor="middle" font-size="55" font-weight="700" fill="#ff5cf2" opacity="0.55" letter-spacing="2">NGUYỄN NGỌC ANH TÚ<animate attributeName="dx" values="0;-3;2;0;-2;0" dur="2.4s" repeatCount="indefinite"/></text>
<text x="450" y="150" text-anchor="middle" font-size="55" font-weight="700" fill="#22d3ee" opacity="0.55" letter-spacing="2">NGUYỄN NGỌC ANH TÚ<animate attributeName="dx" values="0;3;-2;0;2;0" dur="2.4s" repeatCount="indefinite"/></text>
<text x="450" y="150" text-anchor="middle" font-size="55" font-weight="700" fill="url(#hg-name)" letter-spacing="2">NGUYỄN NGỌC ANH TÚ</text>
<text x="450" y="150" text-anchor="middle" font-size="55" font-weight="700" fill="url(#hg-shim)" letter-spacing="2" opacity="0">NGUYỄN NGỌC ANH TÚ<animate attributeName="opacity" values="0;0;1;0;0" dur="5s" repeatCount="indefinite"/></text>
</g>

<g text-anchor="middle">
<text x="450" y="183" font-size="14" fill="#9aa6b8" letter-spacing="2">alias <tspan fill="#22d3ee" font-weight="700">ekaznyra</tspan> <tspan fill="#566072">·</tspan> @ekaznyra<tspan fill="#22d3ee">_</tspan><animate attributeName="opacity" values="1;1;0.25;1" dur="1.1s" repeatCount="indefinite"/></text>
<text x="450" y="207" font-size="13" fill="#e6edf3" letter-spacing="1.5">Cybersecurity Researcher · DFIR · Detection Engineering · Threat Hunting</text>
<text x="450" y="229" font-size="12" fill="#22d3ee" letter-spacing="4" filter="url(#hg-soft)">UNDERSTAND · DETECT · DEFEND</text>
</g>

<g>
<circle cx="350" cy="252" r="3.5" fill="#27c93f">
<animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
</circle>
<text x="362" y="256" font-size="11" fill="#27c93f" letter-spacing="1">OPEN TO COLLABORATE</text>
<rect x="500" y="244" width="2" height="14" fill="#283246"/>
<text x="450" y="278" text-anchor="middle" font-size="10.5" fill="#7d8590" letter-spacing="1">Python · Bash · PowerShell · Splunk · ELK · YARA · Sigma · MITRE ATT&amp;CK</text>
</g>

<rect x="8" y="8" width="884" height="284" fill="url(#hg-scan)"/>
<rect x="8" y="8" width="884" height="284" fill="url(#hg-vig)"/>
<rect x="8" y="8" width="884" height="284" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.16"/>
</g>

<rect x="8" y="8" width="884" height="284" rx="12" fill="none" stroke="#222b3d" stroke-width="1.2"/>

<g stroke="#22d3ee" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round">
<path d="M22 40 V22 H40"/>
<path d="M860 22 H878 V40"/>
<path d="M22 260 V278 H40"/>
<path d="M878 260 V278 H860"/>
</g>
<g stroke="#22d3ee" stroke-width="3" opacity="0.6">
<line x1="450" y1="14" x2="450" y2="20"/>
<line x1="450" y1="280" x2="450" y2="286"/>
</g>

<style>
@media (prefers-reduced-motion: reduce){
* { animation: none !important; }
animate, animateTransform { display: none; }
}
</style>
</svg>