<svg viewBox="0 0 900 260" width="900" xmlns="http://www.w3.org/2000/svg" font-family="&quot;Courier New&quot;,Consolas,ui-monospace,monospace">
  <defs>
    <linearGradient id="m3-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d111a"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <linearGradient id="m3-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#ff5cf2"/>
    </linearGradient>
    <radialGradient id="m3-glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m3-glowM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5cf2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff5cf2" stop-opacity="0"/>
    </radialGradient>
    <filter id="m3-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="m3-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <pattern id="m3-scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <clipPath id="m3-clip"><rect x="14" y="14" width="872" height="232" rx="12"/></clipPath>
    <style>
      @keyframes m3pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes m3beam{0%{transform:translateX(-220px)}100%{transform:translateX(900px)}}
      @keyframes m3caret{0%,49%{opacity:1}50%,100%{opacity:0}}
      .m3led{animation:m3pulse 2.4s ease-in-out infinite;transform-origin:center}
      .m3beam{animation:m3beam 7s linear infinite}
      .m3caret{animation:m3caret 1.05s steps(1) infinite}
      @media (prefers-reduced-motion:reduce){.m3led,.m3beam,.m3caret{animation:none}}
    </style>
  </defs>

  <!-- panel -->
  <rect x="14" y="14" width="872" height="232" rx="12" fill="url(#m3-panel)" stroke="#222b3d" stroke-width="1.2"/>
  <rect x="15.5" y="15.5" width="869" height="229" rx="11" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.16"/>

  <g clip-path="url(#m3-clip)">
    <!-- depth glows -->
    <circle cx="120" cy="60" r="140" fill="url(#m3-glowC)" filter="url(#m3-blur)" opacity="0.5"/>
    <circle cx="800" cy="230" r="150" fill="url(#m3-glowM)" filter="url(#m3-blur)" opacity="0.45"/>
    <!-- scanlines -->
    <rect x="14" y="14" width="872" height="232" fill="url(#m3-scan)"/>
    <!-- scan beam -->
    <g class="m3beam"><rect x="0" y="14" width="160" height="232" fill="url(#m3-glowC)" opacity="0.06"/></g>
    <!-- edge telemetry ticks -->
    <g stroke="#283246" stroke-width="1" opacity="0.5">
      <line x1="26" y1="62" x2="26" y2="238"/>
    </g>
    <g fill="#566072" font-size="6" opacity="0.5" letter-spacing="1">
      <text x="20" y="90" transform="rotate(90 20 90)">01001100 01010011 00100000 01010011 01001111 01000011</text>
    </g>
  </g>

  <!-- corner reticles -->
  <g stroke="#22d3ee" stroke-width="1.4" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M26 40 L26 26 L40 26"/>
    <path d="M860 26 L874 26 L874 40"/>
    <path d="M26 220 L26 234 L40 234"/>
    <path d="M860 234 L874 234 L874 220"/>
  </g>

  <!-- header -->
  <g>
    <circle cx="42" cy="42" r="4.5" fill="#27c93f" class="m3led"/>
    <circle cx="42" cy="42" r="4.5" fill="none" stroke="#27c93f" stroke-width="1" opacity="0.4"/>
    <text x="58" y="46" fill="#22d3ee" font-size="12.5" letter-spacing="2.5" filter="url(#m3-soft)">MOD-03 // ARSENAL</text>
    <!-- right readout + signal bars -->
    <g transform="translate(792,38)">
      <rect x="0" y="2" width="3" height="4" fill="#22d3ee" opacity="0.45"/>
      <rect x="5" y="0" width="3" height="6" fill="#22d3ee" opacity="0.6"/>
      <rect x="10" y="-2" width="3" height="8" fill="#22d3ee" opacity="0.8"/>
      <rect x="15" y="-4" width="3" height="10" fill="#22d3ee"/>
    </g>
    <text x="780" y="46" fill="#7d8590" font-size="10.5" text-anchor="end" letter-spacing="1.5">~/stack</text>
  </g>
  <line x1="26" y1="56" x2="874" y2="56" stroke="#1b2230" stroke-width="1"/>

  <!-- prompt -->
  <g font-size="12" letter-spacing="0.4">
    <text x="40" y="80" fill="#27c93f">ekaznyra@sec</text>
    <text x="133" y="80" fill="#9aa6b8">:</text>
    <text x="140" y="80" fill="#22d3ee">~</text>
    <text x="148" y="80" fill="#9aa6b8">$</text>
    <text x="160" y="80" fill="#e6edf3">cat stack.yaml</text>
    <rect x="262" y="71" width="7" height="11" fill="#22d3ee" class="m3caret"/>
  </g>

  <!-- ASCII shield sigil (right, faint cyan) -->
  <g fill="#22d3ee" opacity="0.13" font-size="9.5" letter-spacing="0.5" xml:space="preserve">
    <text x="788" y="118"> _______ </text>
    <text x="788" y="130">/ ===== \</text>
    <text x="788" y="142">|  [#]  |</text>
    <text x="788" y="154">| ATT&amp;CK |</text>
    <text x="788" y="166"> \ === / </text>
    <text x="788" y="178">  \ = /  </text>
    <text x="788" y="190">   \_/   </text>
  </g>

  <!-- groups -->
  <!-- helper visual: gutter labels cyan, pills tinted -->
  <g font-size="11">
    <!-- languages -->
    <text x="40" y="111" fill="#22d3ee" letter-spacing="1" text-anchor="end" transform="translate(150,0)">languages:</text>
    <g transform="translate(205,100)" font-size="10.5">
      <g><rect x="0" y="0" width="64" height="18" rx="9" fill="#22d3ee" opacity="0.10"/><rect x="0" y="0" width="64" height="18" rx="9" fill="none" stroke="#22d3ee" opacity="0.35"/><text x="32" y="13" fill="#e6edf3" text-anchor="middle">Python</text></g>
      <g transform="translate(72,0)"><rect width="48" height="18" rx="9" fill="#22d3ee" opacity="0.10"/><rect width="48" height="18" rx="9" fill="none" stroke="#22d3ee" opacity="0.35"/><text x="24" y="13" fill="#e6edf3" text-anchor="middle">Bash</text></g>
      <g transform="translate(128,0)"><rect width="92" height="18" rx="9" fill="#22d3ee" opacity="0.10"/><rect width="92" height="18" rx="9" fill="none" stroke="#22d3ee" opacity="0.35"/><text x="46" y="13" fill="#e6edf3" text-anchor="middle">PowerShell</text></g>
    </g>

    <!-- detection -->
    <text x="40" y="139" fill="#ff5cf2" letter-spacing="1" text-anchor="end" transform="translate(150,0)">detection:</text>
    <g transform="translate(205,128)" font-size="10.5">
      <g><rect width="48" height="18" rx="9" fill="#ff5cf2" opacity="0.10"/><rect width="48" height="18" rx="9" fill="none" stroke="#ff5cf2" opacity="0.35"/><text x="24" y="13" fill="#e6edf3" text-anchor="middle">YARA</text></g>
      <g transform="translate(56,0)"><rect width="52" height="18" rx="9" fill="#ff5cf2" opacity="0.10"/><rect width="52" height="18" rx="9" fill="none" stroke="#ff5cf2" opacity="0.35"/><text x="26" y="13" fill="#e6edf3" text-anchor="middle">Sigma</text></g>
      <g transform="translate(116,0)"><rect width="116" height="18" rx="9" fill="#ff5cf2" opacity="0.10"/><rect width="116" height="18" rx="9" fill="none" stroke="#ff5cf2" opacity="0.35"/><text x="58" y="13" fill="#e6edf3" text-anchor="middle">MITRE ATT&amp;CK</text></g>
    </g>

    <!-- siem -->
    <text x="40" y="167" fill="#22d3ee" letter-spacing="1" text-anchor="end" transform="translate(150,0)">siem:</text>
    <g transform="translate(205,156)" font-size="10.5">
      <g><rect width="58" height="18" rx="9" fill="#22d3ee" opacity="0.10"/><rect width="58" height="18" rx="9" fill="none" stroke="#22d3ee" opacity="0.35"/><text x="29" y="13" fill="#e6edf3" text-anchor="middle">Splunk</text></g>
      <g transform="translate(66,0)"><rect width="108" height="18" rx="9" fill="#22d3ee" opacity="0.10"/><rect width="108" height="18" rx="9" fill="none" stroke="#22d3ee" opacity="0.35"/><text x="54" y="13" fill="#e6edf3" text-anchor="middle">Elastic / ELK</text></g>
    </g>

    <!-- dfir -->
    <text x="40" y="195" fill="#ff5cf2" letter-spacing="1" text-anchor="end" transform="translate(150,0)">dfir:</text>
    <g transform="translate(205,184)" font-size="10.5">
      <g><rect width="78" height="18" rx="9" fill="#ff5cf2" opacity="0.10"/><rect width="78" height="18" rx="9" fill="none" stroke="#ff5cf2" opacity="0.32"/><text x="39" y="13" fill="#e6edf3" text-anchor="middle">Wireshark</text></g>
      <g transform="translate(86,0)"><rect width="80" height="18" rx="9" fill="#ff5cf2" opacity="0.10"/><rect width="80" height="18" rx="9" fill="none" stroke="#ff5cf2" opacity="0.32"/><text x="40" y="13" fill="#e6edf3" text-anchor="middle">Volatility</text></g>
    </g>

    <!-- platforms -->
    <text x="40" y="223" fill="#27c93f" letter-spacing="1" text-anchor="end" transform="translate(150,0)">platforms:</text>
    <g transform="translate(205,212)" font-size="10.5">
      <g><rect width="48" height="18" rx="9" fill="#27c93f" opacity="0.10"/><rect width="48" height="18" rx="9" fill="none" stroke="#27c93f" opacity="0.32"/><text x="24" y="13" fill="#e6edf3" text-anchor="middle">Linux</text></g>
      <g transform="translate(56,0)"><rect width="64" height="18" rx="9" fill="#27c93f" opacity="0.10"/><rect width="64" height="18" rx="9" fill="none" stroke="#27c93f" opacity="0.32"/><text x="32" y="13" fill="#e6edf3" text-anchor="middle">Windows</text></g>
      <g transform="translate(128,0)"><rect width="58" height="18" rx="9" fill="#27c93f" opacity="0.10"/><rect width="58" height="18" rx="9" fill="none" stroke="#27c93f" opacity="0.32"/><text x="29" y="13" fill="#e6edf3" text-anchor="middle">Docker</text></g>
      <g transform="translate(194,0)"><rect width="38" height="18" rx="9" fill="#27c93f" opacity="0.10"/><rect width="38" height="18" rx="9" fill="none" stroke="#27c93f" opacity="0.32"/><text x="19" y="13" fill="#e6edf3" text-anchor="middle">Git</text></g>
    </g>
  </g>
</svg>