<svg viewBox="0 0 900 250" width="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paneBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d111a"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#7fe9f4"/>
      <stop offset="1" stop-color="#ff5cf2"/>
    </linearGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="paneClip">
      <rect x="18" y="14" width="864" height="222" rx="12"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="900" height="250" fill="#0d1117"/>

  <rect x="18" y="14" width="864" height="222" rx="12" fill="url(#paneBg)" stroke="#222b3d" stroke-width="1.2"/>

  <g clip-path="url(#paneClip)">
    <circle cx="120" cy="40" r="90" fill="#22d3ee" opacity="0.05" filter="url(#soft)"/>
    <circle cx="820" cy="220" r="100" fill="#ff5cf2" opacity="0.05" filter="url(#soft)"/>
    <rect x="18" y="14" width="864" height="222" fill="url(#scan)"/>
  </g>

  <rect x="18" y="14" width="864" height="222" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.16"/>

  <!-- title bar -->
  <g font-family="'Courier New',Consolas,ui-monospace,monospace">
    <circle cx="44" cy="34" r="6" fill="#ff5f56"/>
    <circle cx="64" cy="34" r="6" fill="#ffbd2e"/>
    <circle cx="84" cy="34" r="6" fill="#27c93f"/>
    <text x="450" y="38" text-anchor="middle" font-size="12.5" fill="#9aa6b8">stack — ekaznyra@sec</text>
    <text x="864" y="38" text-anchor="end" font-size="12.5" fill="#22d3ee" opacity="0.75">~/arsenal</text>
    <line x1="18" y1="52" x2="882" y2="52" stroke="#283246" stroke-width="1"/>
  </g>

  <!-- prompt -->
  <g font-family="'Courier New',Consolas,ui-monospace,monospace" font-size="13.5">
    <text x="40" y="76">
      <tspan fill="#27c93f">ekaznyra@sec</tspan><tspan fill="#7d8590">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#7d8590">$ </tspan><tspan fill="#e6edf3">cat stack.yaml</tspan>
    </text>
  </g>

  <!-- groups + chips -->
  <g font-family="'Courier New',Consolas,ui-monospace,monospace" font-size="12.5">

    <!-- languages -->
    <text x="40" y="106" fill="#22d3ee">languages:</text>
    <g>
      <rect x="148" y="95" width="74" height="20" rx="6" fill="#22d3ee" fill-opacity="0.05" stroke="#283246"/>
      <text x="185" y="109" text-anchor="middle" fill="#e6edf3">Python</text>
      <rect x="232" y="95" width="56" height="20" rx="6" fill="#22d3ee" fill-opacity="0.05" stroke="#283246"/>
      <text x="260" y="109" text-anchor="middle" fill="#e6edf3">Bash</text>
      <rect x="298" y="95" width="106" height="20" rx="6" fill="#22d3ee" fill-opacity="0.05" stroke="#283246"/>
      <text x="351" y="109" text-anchor="middle" fill="#e6edf3">PowerShell</text>
    </g>

    <!-- detection -->
    <text x="40" y="136" fill="#22d3ee">detection:</text>
    <g>
      <rect x="148" y="125" width="56" height="20" rx="6" fill="#ff5cf2" fill-opacity="0.05" stroke="#283246"/>
      <text x="176" y="139" text-anchor="middle" fill="#e6edf3">YARA</text>
      <rect x="214" y="125" width="62" height="20" rx="6" fill="#ff5cf2" fill-opacity="0.05" stroke="#283246"/>
      <text x="245" y="139" text-anchor="middle" fill="#e6edf3">Sigma</text>
      <rect x="286" y="125" width="132" height="20" rx="6" fill="#ff5cf2" fill-opacity="0.05" stroke="#283246"/>
      <text x="352" y="139" text-anchor="middle" fill="#e6edf3">MITRE ATT&amp;CK</text>
    </g>

    <!-- siem -->
    <text x="40" y="166" fill="#22d3ee">siem:</text>
    <g>
      <rect x="148" y="155" width="68" height="20" rx="6" fill="#22d3ee" fill-opacity="0.05" stroke="#283246"/>
      <text x="182" y="169" text-anchor="middle" fill="#e6edf3">Splunk</text>
      <rect x="226" y="155" width="116" height="20" rx="6" fill="#22d3ee" fill-opacity="0.05" stroke="#283246"/>
      <text x="284" y="169" text-anchor="middle" fill="#e6edf3">Elastic / ELK</text>
    </g>

    <!-- dfir -->
    <text x="40" y="196" fill="#22d3ee">dfir:</text>
    <g>
      <rect x="148" y="185" width="92" height="20" rx="6" fill="#ff5cf2" fill-opacity="0.05" stroke="#283246"/>
      <text x="194" y="199" text-anchor="middle" fill="#e6edf3">Wireshark</text>
      <rect x="250" y="185" width="92" height="20" rx="6" fill="#ff5cf2" fill-opacity="0.05" stroke="#283246"/>
      <text x="296" y="199" text-anchor="middle" fill="#e6edf3">Volatility</text>
    </g>

    <!-- platforms -->
    <text x="40" y="226" fill="#22d3ee">platforms:</text>
    <g>
      <rect x="148" y="215" width="56" height="20" rx="6" fill="#22d3ee" fill-opacity="0.05" stroke="#283246"/>
      <text x="176" y="229" text-anchor="middle" fill="#e6edf3">Linux</text>
      <rect x="214" y="215" width="78" height="20" rx="6" fill="#22d3ee" fill-opacity="0.05" stroke="#283246"/>
      <text x="253" y="229" text-anchor="middle" fill="#e6edf3">Windows</text>
      <rect x="302" y="215" width="68" height="20" rx="6" fill="#22d3ee" fill-opacity="0.05" stroke="#283246"/>
      <text x="336" y="229" text-anchor="middle" fill="#e6edf3">Docker</text>
      <rect x="380" y="215" width="46" height="20" rx="6" fill="#22d3ee" fill-opacity="0.05" stroke="#283246"/>
      <text x="403" y="229" text-anchor="middle" fill="#e6edf3">Git</text>
    </g>
  </g>

  <!-- neofetch-style shield on far right -->
  <g font-family="'Courier New',Consolas,ui-monospace,monospace" font-size="11" fill="#22d3ee" opacity="0.30" text-anchor="middle">
    <text x="735" y="108">_________</text>
    <text x="735" y="122">|  .-.  |</text>
    <text x="735" y="136">|  | |  |</text>
    <text x="735" y="150">|  '-'  |</text>
    <text x="735" y="164"> \     / </text>
    <text x="735" y="178">  \   /  </text>
    <text x="735" y="192">   \ /   </text>
    <text x="735" y="206">    v    </text>
  </g>
  <line x1="690" y1="92" x2="690" y2="216" stroke="#283246" stroke-width="1" opacity="0.6"/>
  <g font-family="'Courier New',Consolas,ui-monospace,monospace" font-size="11" fill="#566072" text-anchor="middle">
    <text x="800" y="130"># blue</text>
    <text x="800" y="146"># team</text>
    <text x="800" y="170">5 groups</text>
    <text x="800" y="186">14 tools</text>
  </g>

  <!-- blinking cursor -->
  <rect x="40" y="238" width="9" height="2" fill="#22d3ee">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>