<svg viewBox="0 0 900 120" width="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ftWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d111a"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <linearGradient id="ftHero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#7fe9f4"/>
      <stop offset="1" stop-color="#ff5cf2"/>
    </linearGradient>
    <pattern id="ftScan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <clipPath id="ftClip">
      <rect x="18" y="14" width="864" height="92" rx="12"/>
    </clipPath>
    <filter id="ftBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="120" fill="#0d1117"/>

  <rect x="18" y="14" width="864" height="92" rx="12" fill="url(#ftWin)" stroke="#222b3d" stroke-width="1.2"/>

  <g clip-path="url(#ftClip)">
    <circle cx="120" cy="40" r="80" fill="#22d3ee" opacity="0.05" filter="url(#ftBlur)"/>
    <circle cx="800" cy="96" r="80" fill="#ff5cf2" opacity="0.05" filter="url(#ftBlur)"/>
    <rect x="18" y="14" width="864" height="92" fill="url(#ftScan)"/>
  </g>

  <rect x="18" y="14" width="864" height="92" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.16"/>

  <g font-family="'Courier New',Consolas,ui-monospace,monospace">
    <text x="42" y="44" font-size="13">
      <tspan fill="#27c93f">ekaznyra@sec</tspan><tspan fill="#7d8590">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#7d8590">$ </tspan><tspan fill="#e6edf3">./defend.sh --run</tspan>
    </text>

    <text x="42" y="76" font-size="22" font-weight="bold" letter-spacing="2" fill="url(#ftHero)">Understand · Detect · Defend</text>

    <text x="42" y="95" font-size="12" fill="#566072"># thanks for stopping by — let's build better detections</text>

    <text x="700" y="95" font-size="13" text-anchor="start">
      <tspan fill="#27c93f">ekaznyra@sec</tspan><tspan fill="#7d8590">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#7d8590">$ </tspan>
    </text>
    <rect x="827" y="86" width="9" height="13" fill="#22d3ee">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.06s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>