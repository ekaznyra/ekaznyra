<svg viewBox="0 0 900 250" width="900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cyber kill-chain mapped to detections: Recon, Weaponization, Delivery, Exploit, Install, C2, Actions — chain broken at C2 by a Sigma match" font-family="'Courier New',Consolas,ui-monospace,monospace">
  <title>MOD-06 // KILL-CHAIN — adversary lifecycle mapped to detections</title>
  <desc>Seven cyber kill-chain stages shown as linked hexagon nodes with a data packet flowing along the chain; a detection ring fires at the C2 stage indicating the chain is broken by a Sigma match. Coverage 7 of 7.</desc>
  <defs>
    <linearGradient id="kc-panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d111a"/><stop offset="1" stop-color="#090c12"/></linearGradient>
    <linearGradient id="kc-accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#ffbd2e"/><stop offset="1" stop-color="#ff5cf2"/></linearGradient>
    <linearGradient id="kc-link" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#ffbd2e"/><stop offset="1" stop-color="#ff5cf2"/></linearGradient>
    <radialGradient id="kc-glowC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="kc-glowM" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5cf2" stop-opacity="0.5"/><stop offset="1" stop-color="#ff5cf2" stop-opacity="0"/></radialGradient>
    <radialGradient id="kc-pkt" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#7fe6f5"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <filter id="kc-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="kc-bloom" x="-60%" y="-120%" width="220%" height="340%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="kc-scan" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1" fill="#ffffff" opacity="0.02"/></pattern>
    <clipPath id="kc-clip"><rect x="14" y="14" width="872" height="222" rx="12"/></clipPath>
    <style>
      @keyframes kcled{0%,100%{opacity:1}50%{opacity:.35}}
      @keyframes kcping{0%{transform:scale(1);opacity:.5}70%,100%{transform:scale(2.8);opacity:0}}
      @keyframes kccaret{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes kcbreathe{0%,100%{opacity:.72}50%{opacity:.4}}
      @keyframes kceq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
      @keyframes kcflow{to{stroke-dashoffset:-28}}
      @keyframes kcpkt{0%{transform:translateX(0);opacity:0}6%{opacity:1}64%{transform:translateX(496px);opacity:1}72%,100%{transform:translateX(496px);opacity:0}}
      @keyframes kcalert{0%{transform:scale(.6);opacity:0}60%{opacity:.9}100%{transform:scale(2.6);opacity:0}}
      @keyframes kcnode{0%,100%{opacity:1}50%{opacity:.55}}
      @keyframes kcpop{0%,58%{opacity:0;transform:scale(.4)}66%{opacity:1;transform:scale(1.2)}74%,100%{opacity:1;transform:scale(1)}}
      @keyframes kcbeam{0%{transform:translateX(-200px)}100%{transform:translateX(900px)}}
      .kc-led{animation:kcled 2s ease-in-out infinite}
      .kc-ping{animation:kcping 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
      .kc-caret{animation:kccaret 1.05s step-end infinite}
      .kc-breathe{animation:kcbreathe 4s ease-in-out infinite}
      .kc-eqbar{animation:kceq 1.15s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
      .kc-flow{animation:kcflow 1.1s linear infinite}
      .kc-pktwrap{animation:kcpkt 5.2s cubic-bezier(.5,0,.5,1) infinite;transform-box:view-box}
      .kc-alert{animation:kcalert 5.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
      .kc-c2{animation:kcnode 1.6s ease-in-out infinite}
      .kc-brk{animation:kcpop 5.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
      .kc-beam{animation:kcbeam 8s linear infinite}
      @media (prefers-reduced-motion:reduce){.kc-led,.kc-ping,.kc-caret,.kc-breathe,.kc-eqbar,.kc-flow,.kc-pktwrap,.kc-alert,.kc-c2,.kc-brk,.kc-beam{animation:none}}
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="250" fill="#0d1117"/>
  <rect x="14" y="14" width="872" height="222" rx="12" fill="url(#kc-panel)" stroke="#222b3d" stroke-width="1.2"/>
  <rect x="15.5" y="15.5" width="869" height="219" rx="11" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.16"/>

  <g clip-path="url(#kc-clip)">
    <circle cx="130" cy="70" r="200" fill="url(#kc-glowC)" opacity="0.5"/>
    <circle cx="800" cy="210" r="210" fill="url(#kc-glowM)" opacity="0.45"/>
    <rect x="14" y="14" width="872" height="222" fill="url(#kc-scan)"/>
    <g class="kc-beam"><rect x="14" y="14" width="150" height="222" fill="url(#kc-glowC)" opacity="0.05"/></g>
    <g fill="#22d3ee" opacity="0.07" font-size="7" letter-spacing="2"><text x="26" y="230">01001011 01001001 01001100 01001100 // CHAIN // RECON→C2 // DETECT::CONTAIN</text></g>
  </g>

  <g class="kc-breathe" stroke="#22d3ee" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M26 40 L26 26 L40 26"/><path d="M860 26 L874 26 L874 40"/>
    <path d="M26 210 L26 224 L40 224"/><path d="M860 224 L874 224 L874 210"/>
  </g>

  <g>
    <circle class="kc-ping" cx="42" cy="42" r="4.5" fill="none" stroke="#27c93f" stroke-width="1.4"/>
    <circle class="kc-led" cx="42" cy="42" r="4.5" fill="#27c93f" filter="url(#kc-soft)"/>
    <circle cx="42" cy="42" r="4.5" fill="none" stroke="#27c93f" stroke-width="1" opacity="0.4"/>
    <text x="58" y="46" fill="#22d3ee" font-size="12.5" letter-spacing="2.5" font-weight="bold" filter="url(#kc-bloom)">MOD-06 // KILL-CHAIN</text>
    <g fill="#22d3ee">
      <rect class="kc-eqbar" x="792" y="35" width="3" height="13"/>
      <rect class="kc-eqbar" x="797" y="35" width="3" height="13" style="animation-delay:-.35s"/>
      <rect class="kc-eqbar" x="802" y="35" width="3" height="13" style="animation-delay:-.7s"/>
      <rect class="kc-eqbar" x="807" y="35" width="3" height="13" style="animation-delay:-.9s"/>
    </g>
    <text x="862" y="46" fill="#7d8590" font-size="10.5" text-anchor="end" letter-spacing="1.5">~/killchain · MITRE</text>
  </g>
  <line x1="26" y1="56" x2="874" y2="56" stroke="#1b2230" stroke-width="1"/>

  <g font-size="12.5">
    <text x="40" y="80"><tspan fill="#27c93f">ekaznyra@sec</tspan><tspan fill="#9aa6b8">:</tspan><tspan fill="#22d3ee">~$</tspan><tspan fill="#e6edf3"> ./map-attack.sh </tspan><tspan fill="#ff5cf2">--defend</tspan></text>
    <rect class="kc-caret" x="392" y="71" width="7" height="11" fill="#22d3ee"/>
  </g>
  <text x="40" y="102" fill="#566072" font-size="10" letter-spacing="1.5"># cyber kill-chain · mapped to detections</text>

  <!-- chain link -->
  <line x1="78" y1="138" x2="822" y2="138" stroke="#283246" stroke-width="3"/>
  <line class="kc-flow" x1="78" y1="138" x2="822" y2="138" stroke="url(#kc-link)" stroke-width="2" stroke-dasharray="10 18" opacity="0.85"/>
  <!-- nodes -->
  <g>
    <g>
      <path d="M48 138 L63 113 L93 113 L108 138 L93 163 L63 163 Z" fill="#0e1620"/>
      <path d="M48 138 L63 113 L93 113 L108 138 L93 163 L63 163 Z" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-width="1.6" stroke-opacity="0.85"/>
      <path d="M48 138 L63 113 L93 113 L108 138 L93 163 L63 163 Z" fill="none" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.25" transform="translate(0,0)"/>
      <text x="78" y="143" text-anchor="middle" fill="#22d3ee" font-size="15" font-weight="bold" filter="url(#kc-soft)">01</text>
      <circle cx="96" cy="117" r="2.4" fill="#27c93f"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" begin="0.0s" repeatCount="indefinite"/></circle>
      <text x="78" y="185" text-anchor="middle" fill="#e6edf3" font-size="10.5" letter-spacing="1" font-weight="bold">RECON</text>
      <text x="78" y="200" text-anchor="middle" fill="#9aa6b8" font-size="8.5" letter-spacing="0.5">netflow</text>
    </g>
    <g>
      <path d="M172 138 L187 113 L217 113 L232 138 L217 163 L187 163 Z" fill="#0e1620"/>
      <path d="M172 138 L187 113 L217 113 L232 138 L217 163 L187 163 Z" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-width="1.6" stroke-opacity="0.85"/>
      <path d="M172 138 L187 113 L217 113 L232 138 L217 163 L187 163 Z" fill="none" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.25" transform="translate(0,0)"/>
      <text x="202" y="143" text-anchor="middle" fill="#22d3ee" font-size="15" font-weight="bold" filter="url(#kc-soft)">02</text>
      <circle cx="220" cy="117" r="2.4" fill="#27c93f"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" begin="-0.3s" repeatCount="indefinite"/></circle>
      <text x="202" y="185" text-anchor="middle" fill="#e6edf3" font-size="10.5" letter-spacing="1" font-weight="bold">WEAPON</text>
      <text x="202" y="200" text-anchor="middle" fill="#9aa6b8" font-size="8.5" letter-spacing="0.5">threat-intel</text>
    </g>
    <g>
      <path d="M296 138 L311 113 L341 113 L356 138 L341 163 L311 163 Z" fill="#0e1620"/>
      <path d="M296 138 L311 113 L341 113 L356 138 L341 163 L311 163 Z" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-width="1.6" stroke-opacity="0.85"/>
      <path d="M296 138 L311 113 L341 113 L356 138 L341 163 L311 163 Z" fill="none" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.25" transform="translate(0,0)"/>
      <text x="326" y="143" text-anchor="middle" fill="#22d3ee" font-size="15" font-weight="bold" filter="url(#kc-soft)">03</text>
      <circle cx="344" cy="117" r="2.4" fill="#27c93f"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" begin="-0.6s" repeatCount="indefinite"/></circle>
      <text x="326" y="185" text-anchor="middle" fill="#e6edf3" font-size="10.5" letter-spacing="1" font-weight="bold">DELIVERY</text>
      <text x="326" y="200" text-anchor="middle" fill="#9aa6b8" font-size="8.5" letter-spacing="0.5">proxy / mail</text>
    </g>
    <g>
      <path d="M420 138 L435 113 L465 113 L480 138 L465 163 L435 163 Z" fill="#0e1620"/>
      <path d="M420 138 L435 113 L465 113 L480 138 L465 163 L435 163 Z" fill="#ffbd2e" fill-opacity="0.10" stroke="#ffbd2e" stroke-width="1.6" stroke-opacity="0.85"/>
      <path d="M420 138 L435 113 L465 113 L480 138 L465 163 L435 163 Z" fill="none" stroke="#ffbd2e" stroke-width="0.8" stroke-opacity="0.25" transform="translate(0,0)"/>
      <text x="450" y="143" text-anchor="middle" fill="#ffbd2e" font-size="15" font-weight="bold" filter="url(#kc-soft)">04</text>
      <circle cx="468" cy="117" r="2.4" fill="#27c93f"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" begin="-0.8999999999999999s" repeatCount="indefinite"/></circle>
      <text x="450" y="185" text-anchor="middle" fill="#e6edf3" font-size="10.5" letter-spacing="1" font-weight="bold">EXPLOIT</text>
      <text x="450" y="200" text-anchor="middle" fill="#9aa6b8" font-size="8.5" letter-spacing="0.5">YARA</text>
    </g>
    <g>
      <path d="M544 138 L559 113 L589 113 L604 138 L589 163 L559 163 Z" fill="#0e1620"/>
      <path d="M544 138 L559 113 L589 113 L604 138 L589 163 L559 163 Z" fill="#ffbd2e" fill-opacity="0.10" stroke="#ffbd2e" stroke-width="1.6" stroke-opacity="0.85"/>
      <path d="M544 138 L559 113 L589 113 L604 138 L589 163 L559 163 Z" fill="none" stroke="#ffbd2e" stroke-width="0.8" stroke-opacity="0.25" transform="translate(0,0)"/>
      <text x="574" y="143" text-anchor="middle" fill="#ffbd2e" font-size="15" font-weight="bold" filter="url(#kc-soft)">05</text>
      <circle cx="592" cy="117" r="2.4" fill="#27c93f"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" begin="-1.2s" repeatCount="indefinite"/></circle>
      <text x="574" y="185" text-anchor="middle" fill="#e6edf3" font-size="10.5" letter-spacing="1" font-weight="bold">INSTALL</text>
      <text x="574" y="200" text-anchor="middle" fill="#9aa6b8" font-size="8.5" letter-spacing="0.5">EDR · Sysmon</text>
    </g>
    <g>
      <path d="M668 138 L683 113 L713 113 L728 138 L713 163 L683 163 Z" fill="#0e1620"/>
      <path class="kc-c2" d="M668 138 L683 113 L713 113 L728 138 L713 163 L683 163 Z" fill="#ff5cf2" fill-opacity="0.10" stroke="#ff5cf2" stroke-width="1.6" stroke-opacity="0.85"/>
      <path d="M668 138 L683 113 L713 113 L728 138 L713 163 L683 163 Z" fill="none" stroke="#ff5cf2" stroke-width="0.8" stroke-opacity="0.25" transform="translate(0,0)"/>
      <text x="698" y="143" text-anchor="middle" fill="#ff5cf2" font-size="15" font-weight="bold" filter="url(#kc-soft)">06</text>
      <circle cx="716" cy="117" r="2.4" fill="#27c93f"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" begin="-1.5s" repeatCount="indefinite"/></circle>
      <text x="698" y="185" text-anchor="middle" fill="#e6edf3" font-size="10.5" letter-spacing="1" font-weight="bold">C2</text>
      <text x="698" y="200" text-anchor="middle" fill="#9aa6b8" font-size="8.5" letter-spacing="0.5">Sigma</text>
    </g>
    <g>
      <path d="M792 138 L807 113 L837 113 L852 138 L837 163 L807 163 Z" fill="#0e1620"/>
      <path d="M792 138 L807 113 L837 113 L852 138 L837 163 L807 163 Z" fill="#ff5cf2" fill-opacity="0.10" stroke="#ff5cf2" stroke-width="1.6" stroke-opacity="0.85"/>
      <path d="M792 138 L807 113 L837 113 L852 138 L837 163 L807 163 Z" fill="none" stroke="#ff5cf2" stroke-width="0.8" stroke-opacity="0.25" transform="translate(0,0)"/>
      <text x="822" y="143" text-anchor="middle" fill="#ff5cf2" font-size="15" font-weight="bold" filter="url(#kc-soft)">07</text>
      <circle cx="840" cy="117" r="2.4" fill="#27c93f"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" begin="-1.7999999999999998s" repeatCount="indefinite"/></circle>
      <text x="822" y="185" text-anchor="middle" fill="#e6edf3" font-size="10.5" letter-spacing="1" font-weight="bold">ACTIONS</text>
      <text x="822" y="200" text-anchor="middle" fill="#9aa6b8" font-size="8.5" letter-spacing="0.5">SIEM · UEBA</text>
    </g>
  </g>
  <!-- C2 detection interception -->
  <g>
    <circle class="kc-alert" cx="698" cy="138" r="30" fill="none" stroke="#ff5cf2" stroke-width="2"/>
    <circle cx="698" cy="138" r="34" fill="none" stroke="#ff5cf2" stroke-width="1" opacity="0.35"/>
  </g>

  <!-- data packet flowing along chain -->
  <g class="kc-pktwrap">
    <circle cx="78" cy="138" r="9" fill="url(#kc-pkt)" opacity="0.9"/>
    <circle cx="78" cy="138" r="3.2" fill="#ffffff"/>
    <path d="M62 138 L78 138" stroke="#7fe6f5" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- chain-broken marker -->
  <g class="kc-brk" transform="translate(698,138)">
    <g transform="translate(0,-46)">
      <rect x="-52" y="-13" width="104" height="22" rx="5" fill="#160a12" stroke="#ff5cf2" stroke-width="1.2"/>
      <text x="0" y="2" text-anchor="middle" fill="#ff5cf2" font-size="9.5" font-weight="bold" letter-spacing="1.5">⛒ CHAIN BROKEN</text>
      <path d="M0 9 L-5 9 L0 15 L5 9 Z" fill="#ff5cf2"/>
    </g>
  </g>

  <line x1="26" y1="210" x2="874" y2="210" stroke="#1b2230" stroke-width="1"/>
  <g font-size="11">
    <text x="40" y="228" fill="#9aa6b8">defense</text>
    <text x="110" y="228" fill="#566072">:</text>
    <text x="122" y="228" fill="#22d3ee" font-weight="bold">monitor</text>
    <text x="188" y="228" fill="#566072">→</text>
    <text x="202" y="228" fill="#ffbd2e" font-weight="bold">detect</text>
    <text x="258" y="228" fill="#566072">→</text>
    <text x="272" y="228" fill="#27c93f" font-weight="bold">contain</text>
  </g>
  <g font-size="10.5" text-anchor="end">
    <text x="874" y="228" fill="#566072">coverage <tspan fill="#27c93f" font-weight="bold">7/7</tspan> · broken @ <tspan fill="#ff5cf2" font-weight="bold">C2</tspan> · <tspan fill="#ffbd2e">MTTD ↓</tspan></text>
  </g>
</svg>
