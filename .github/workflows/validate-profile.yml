name: Autonomous Zero-Tolerance Validation Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    name: First-Principles Asset & Markdown Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🚀 Checkout Codebase (Zero-Copy)
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12 (Strict Mode)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: 🛡️ Validate SVGs & Asset Integrity (Strict Typing)
        shell: python
        run: |
          import re
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from typing import List

          def enforce_invariants() -> None:
              root: Path = Path.cwd()
              assets: List[Path] = sorted((root / "assets").glob("*.svg"))
              
              if not assets:
                  print("[-] Fatal Error: No SVG assets found in /assets", file=sys.stderr)
                  sys.exit(1)

              # Validate physical structure of SVGs
              for asset in assets:
                  try:
                      document = ET.parse(asset)
                  except ET.ParseError as error:
                      print(f"[-] Fatal Error: Memory corruption or invalid SVG at {asset}: {error}", file=sys.stderr)
                      sys.exit(1)
                      
                  svg = document.getroot()
                  if svg.tag != "{http://www.w3.org/2000/svg}svg":
                      print(f"[-] Fatal Error: Invalid XML Namespace in {asset}", file=sys.stderr)
                      sys.exit(1)
                      
                  if not svg.get("viewBox"):
                      print(f"[-] Fatal Error: Missing viewBox invariant in {asset} (Unscalable Vector)", file=sys.stderr)
                      sys.exit(1)

              # Validate Markdown Memory Pointers
              readme_path: Path = root / "README.md"
              if not readme_path.exists():
                  print("[-] Fatal Error: README.md is missing from root", file=sys.stderr)
                  sys.exit(1)
                  
              readme: str = readme_path.read_text(encoding="utf-8")
              references: List[str] = re.findall(r'<img[^>]+src="([^"]+)"', readme)
              
              local_refs: List[str] = [ref for ref in references if not ref.startswith(("http://", "https://"))]
              missing: List[str] = [ref for ref in local_refs if not (root / ref).is_file()]
              
              if missing:
                  print("[-] Fatal Error: Broken pointers detected: " + ", ".join(missing), file=sys.stderr)
                  sys.exit(1)

              print(f"[+] L1 Cache Flushed. Validated {len(assets)} SVGs and {len(local_refs)} pointer references successfully.")
              sys.exit(0)

          if __name__ == "__main__":
              enforce_invariants()
